spring.application.name=payment-service
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/paymentdb}
spring.datasource.username=${DB_USERNAME:paymentuser}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

service.api-key=${SERVICE_API_KEY}
order-service.url=${ORDER_SERVICE_URL:http://localhost:8083}
order-service.api-key=${ORDER_SERVICE_API_KEY}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never
