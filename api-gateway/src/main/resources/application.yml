server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # =========================
            # BOOK SERVICE
            # =========================
            - id: book-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/books,/api/books/**
              filters:
                - AddRequestHeader=X-API-KEY, ${BOOK_API_KEY}

            # =========================
            # USER SERVICE
            # =========================
            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/users,/api/users/**
              filters:
                - RewritePath=/api/users(?<remaining>/?.*), /users${remaining}
                - AddRequestHeader=X-API-KEY, ${USER_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info